# Replace age1REPLACE_WITH_ADMIN_PUBLIC_KEY with the admin age public key
# (`age-keygen -y ~/.config/sops/age/keys.txt`) before running sops.
keys:
  - &admin age1REPLACE_WITH_ADMIN_PUBLIC_KEY
creation_rules:
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *admin
  - path_regex: secrets/hosts/[^/]+\.yaml$
    key_groups:
      - age:
          - *admin
